# ===============================
# SERVICE CONFIG
# ===============================

spring.application.name=${SPRING_APPLICATION_NAME:social-service}

server.port=${SERVER_PORT_SOCIAL:${SERVER_PORT:7075}}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:${SPRING_PROFILE:local}}


# ===============================
# MSSQL DATABASE CONFIG
# ===============================

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:ltz_social_db};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Pass123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# ===============================
# JWT VALIDATION CONFIG
# ===============================

jwt.secret=${JWT_SECRET:LTZ_AUTH_SERVICE_SECRET_KEY_2026_SUPER_SECURE_123456}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# ===============================
# MEDIA UPLOAD CONFIG
# ===============================

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
app.media.upload-dir=${SOCIAL_MEDIA_UPLOAD_DIR:uploads/social-images}
app.media.video-upload-dir=${SOCIAL_MEDIA_VIDEO_UPLOAD_DIR:uploads/social-videos}
app.media.max-image-size-bytes=${SOCIAL_MEDIA_MAX_IMAGE_SIZE_BYTES:10485760}
app.media.max-video-size-bytes=${SOCIAL_MEDIA_MAX_VIDEO_SIZE_BYTES:52428800}
app.media.max-user-storage-bytes=${SOCIAL_MEDIA_MAX_USER_STORAGE_BYTES:524288000}
app.media.daily-upload-limit=${SOCIAL_MEDIA_DAILY_UPLOAD_LIMIT:20}
app.media.pending-ttl-minutes=${SOCIAL_MEDIA_PENDING_TTL_MINUTES:60}
app.media.cleanup-fixed-delay-ms=${SOCIAL_MEDIA_CLEANUP_FIXED_DELAY_MS:900000}
