# ===============================
# SERVICE CONFIG
# ===============================

server.port=${SERVER_PORT_SOCIAL}

spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# ===============================
# MSSQL DATABASE CONFIG
# ===============================

spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${SOCIAL_DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# ===============================
# JWT VALIDATION CONFIG
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# ===============================
# MEDIA UPLOAD CONFIG
# ===============================

spring.servlet.multipart.max-file-size=${SOCIAL_MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${SOCIAL_MULTIPART_MAX_REQUEST_SIZE}
server.tomcat.max-http-form-post-size=${SOCIAL_TOMCAT_MAX_HTTP_FORM_POST_SIZE}
server.tomcat.max-swallow-size=${SOCIAL_TOMCAT_MAX_SWALLOW_SIZE}

app.media.upload-dir=${SOCIAL_MEDIA_UPLOAD_DIR}
app.media.video-upload-dir=${SOCIAL_MEDIA_VIDEO_UPLOAD_DIR}
app.media.max-image-size-bytes=${SOCIAL_MEDIA_MAX_IMAGE_SIZE_BYTES}
app.media.max-video-size-bytes=${SOCIAL_MEDIA_MAX_VIDEO_SIZE_BYTES}
app.media.max-user-storage-bytes=${SOCIAL_MEDIA_MAX_USER_STORAGE_BYTES}
app.media.daily-upload-limit=${SOCIAL_MEDIA_DAILY_UPLOAD_LIMIT}
app.media.pending-ttl-minutes=${SOCIAL_MEDIA_PENDING_TTL_MINUTES}
app.media.cleanup-fixed-delay-ms=${SOCIAL_MEDIA_CLEANUP_FIXED_DELAY_MS}