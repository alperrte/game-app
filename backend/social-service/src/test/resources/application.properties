spring.profiles.active=test
server.port=0

spring.datasource.url=jdbc:h2:mem:socialtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
jwt.expiration=900000

game.service.url=http://localhost:7073
game.service.connect-timeout=3s
game.service.read-timeout=15s
game.service.games-path=/api/games
game.service.platforms-path=/api/games/platforms
game.service.external-apps-path=/api/games/external/apps
game.service.external-source=STEAM
game.service.external-page=1
game.service.external-size=50000
game.service.fallback-platform=Steam

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

app.media.upload-dir=${java.io.tmpdir}/ltz-social-test/images
app.media.video-upload-dir=${java.io.tmpdir}/ltz-social-test/videos
app.media.max-image-size-bytes=10485760
app.media.max-video-size-bytes=52428800
app.media.max-user-storage-bytes=524288000
app.media.daily-upload-limit=20
app.media.pending-ttl-minutes=60
app.media.cleanup-fixed-delay-ms=3600000
