# ===============================
# SERVICE CONFIG
# ===============================

server.port=${SERVER_PORT_AUTH}


spring.profiles.active=${SPRING_PROFILES_ACTIVE}


# ===============================
# MSSQL DATABASE CONFIG
# ===============================

spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# ===============================
# JWT VALIDATION CONFIG
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION}


# ===============================
# INTERNAL SERVICE SECRET
# ===============================

# Servisler arası /internal/** çağrılarını korur.
# user-service ile aynı değer olmalıdır.
# Fallback yok: bu değer set edilmeden servis ayağa kalkmaz.
internal.secret=${INTERNAL_SECRET}


# ===============================
# APP / OAUTH CONFIG
# ===============================

# Frontend tabanı: OAuth sonrası token'larla buraya yönlendirilir (/oauth/callback)
app.frontend-url=${FRONTEND_URL}

# Public API Gateway tabanı: OAuth sağlayıcılarının geri döneceği (return_to) adres
app.public-base-url=${PUBLIC_API_GATEWAY_URL}

# Steam Web API anahtarı (opsiyonel; boşsa profil adı yerine fallback kullanılır)
steam.api-key=${STEAM_API_KEY:}


# ===============================
# DEFAULT (SEED) USERS - YALNIZCA GELİŞTİRME
# Her rol için varsayılan kullanıcı. Canlıda DEFAULT_USERS_ENABLED=false yapın.
# ===============================

app.default-users.enabled=${DEFAULT_USERS_ENABLED}
app.default-users.password=${DEFAULT_USERS_PASSWORD}
app.default-users.user-email=${DEFAULT_USER_EMAIL}
app.default-users.admin-email=${DEFAULT_ADMIN_EMAIL}
app.default-users.moderator-email=${DEFAULT_MODERATOR_EMAIL}
app.default-users.developer-email=${DEFAULT_DEVELOPER_EMAIL}
app.default-users.content-creator-email=${DEFAULT_CONTENTCREATOR_EMAIL}


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always