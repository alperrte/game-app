# ===============================
# ? API GATEWAY CONFIG
# ===============================

spring.application.name=api-gateway
server.port=${SERVER_PORT:${SERVER_PORT_GATEWAY:7070}}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:${SPRING_PROFILE:local}}

# ===============================
# ? ROUTES - SPRING CLOUD GATEWAY WEBFLUX
# ===============================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:7071}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=game-service
spring.cloud.gateway.server.webflux.routes[1].uri=${GAME_SERVICE_URL:http://localhost:7073}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/games/**

#Bir sonraki servisleri buraya ekleyece?iz.
spring.cloud.gateway.server.webflux.routes[2].id=user-service
spring.cloud.gateway.server.webflux.routes[2].uri=${USER_SERVICE_URL:http://localhost:7072}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[3].id=social-service
spring.cloud.gateway.server.webflux.routes[3].uri=${SOCIAL_SERVICE_URL:http://localhost:7075}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/social/**


# ===============================
# ? ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# ===============================
# ? LOGGING
# ===============================

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
