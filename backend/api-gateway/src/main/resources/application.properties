# ===============================
# ? API GATEWAY CONFIG
# ===============================

spring.application.name=api-gateway
server.port=${SERVER_PORT}
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# ===============================
# ? ROUTES - SPRING CLOUD GATEWAY WEBFLUX
# ===============================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=game-service
spring.cloud.gateway.server.webflux.routes[1].uri=${GAME_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/game/**

#Bir sonraki servisleri buraya ekleyece?iz.
spring.cloud.gateway.server.webflux.routes[2].id=user-service
spring.cloud.gateway.server.webflux.routes[2].uri=${USER_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[3].id=social-service
spring.cloud.gateway.server.webflux.routes[3].uri=${SOCIAL_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/social/**


# ===============================
# ? ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# ===============================
# ? LOGGING
# ===============================

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# ===============================
# CORS CONFIG
# ===============================

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173,http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposedHeaders=Authorization
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# Alt servisler de CORS başlığı eklerse tarayıcıya tek değer gönder.
spring.cloud.gateway.server.webflux.default-filters[0].name=DedupeResponseHeader
spring.cloud.gateway.server.webflux.default-filters[0].args.name=Access-Control-Allow-Credentials Access-Control-Allow-Origin
spring.cloud.gateway.server.webflux.default-filters[0].args.strategy=RETAIN_FIRST
