# ===============================
# ? API GATEWAY CONFIG
# ===============================

spring.application.name=api-gateway
server.port=${SERVER_PORT}
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# ===============================
# ? ROUTES - SPRING CLOUD GATEWAY WEBFLUX
# ===============================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=social-service
spring.cloud.gateway.server.webflux.routes[1].uri=${SOCIAL_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/social/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=${USER_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**



# ===============================
# ? ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# ===============================
# ? LOGGING
# ===============================

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
