# Isolated H2 database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway for tests
spring.flyway.enabled=false

# JPA/Hibernate configurations
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT validation config
jwt.secret=${JWT_SECRET:dummySecretKeyMustBeAtLeast32BytesLong123456}
jwt.expiration=${JWT_EXPIRATION:3600000}


# Twitch properties for testing
twitch.client-id=${TWITCH_CLIENT_ID:dummy-twitch-client-id}
twitch.client-secret=${TWITCH_CLIENT_SECRET:dummy-twitch-secret}

# PandaScore properties for testing
pandascore.api-key=${PANDASCORE_API_KEY:dummy-pandascore-key}
