# Isolated H2 database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway for tests
spring.flyway.enabled=false

# JPA/Hibernate configurations
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Keep open-in-view warning clean
spring.jpa.open-in-view=false

# Test JWT secret key
jwt.secret=${JWT_SECRET:dummy}
jwt.expiration=900000

# Test service URLs and secrets
auth.service.url=${AUTH_SERVICE_URL:http://localhost:7071}
review.service.url=${REVIEW_SERVICE_URL:http://localhost:7074}
social.service.url=${SOCIAL_SERVICE_URL:http://localhost:7075}
internal.secret=${INTERNAL_SECRET:mockInternalSecret}
