# ==========================================
# 🧪 LOBBY TWO ZERO - USER-SERVICE TEST CONFIG (H2)
# ==========================================

spring.application.name=user-service-test

# Use in-memory H2 Database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration for H2 Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway migrations in test suite for database isolation
spring.flyway.enabled=false

# Test JWT Keys
jwt.secret=LTZ_AUTH_SERVICE_SECRET_KEY_2026_SUPER_SECURE_123456
jwt.expiration=86400000

# Configure Async execution for testing
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=10

# Disable Multipart limits for standard mock tests
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
