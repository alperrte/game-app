# ===============================
# SERVICE CONFIG
# ===============================

spring.application.name=user-service

server.port=${SERVER_PORT}

spring.profiles.active=${SPRING_PROFILES_ACTIVE}


# ===============================
# MSSQL DATABASE CONFIG
# ===============================

spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false




# ===============================
# JWT VALIDATION CONFIG
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


# ===============================
# AUTH SERVICE CLIENT
# ===============================

auth.service.url=${AUTH_SERVICE_URL}
review.service.url=${REVIEW_SERVICE_URL}
social.service.url=${SOCIAL_SERVICE_URL}

# auth-service /internal/** endpoint'lerini korumak için kullanılan shared secret.
# auth-service ile aynı değer olmalıdır.
# Fallback yok: bu değer set edilmeden servis ayağa kalkmaz.
internal.secret=${INTERNAL_SECRET}


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# MULTIPART UPLOAD CONFIG
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# File Upload Configuration
app.upload.dir=${UPLOAD_DIR:uploads/}
app.upload.url-prefix=/api/users/uploads/

# Security & Business Constraints
app.security.role-prefix=ROLE_
app.user-profile.last-seen-update-interval-minutes=5

