# ===============================
# SERVICE CONFIG
# ===============================


spring.application.name=game-service

server.port=${SERVER_PORT_GAME:7073}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:${SPRING_PROFILE:local}}


# -------------------------------
# STEAM API KEY
# -------------------------------


steam.api.key=${STEAM_API_KEY:}


# ===============================
# MSSQL DATABASE CONFIG
# ===============================

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:ltz_game_db};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Pass123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# ===============================
# JWT VALIDATION CONFIG
# ===============================

jwt.secret=${JWT_SECRET:LTZ_AUTH_SERVICE_SECRET_KEY_2026_SUPER_SECURE_123456}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
