# ===============================
# SERVICE CONFIG
# ===============================

spring.application.name=game-service

server.port=${SERVER_PORT_GAME}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:${SPRING_PROFILE}}


# -------------------------------
# STEAM API KEY
# -------------------------------

steam.api.key=${STEAM_API_KEY}


# ===============================
# MSSQL DATABASE CONFIG
# ===============================

spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}


# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# ===============================
# JWT VALIDATION CONFIG
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}


# ===============================
# SPRINGDOC / SWAGGER
# ===============================

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}


# ===============================
# EXTERNAL API RATE LIMIT
# ===============================

external.api.rate-limit.enabled=${EXTERNAL_API_RATE_LIMIT_ENABLED:true}
external.api.rate-limit.max-requests=${EXTERNAL_API_RATE_LIMIT_MAX_REQUESTS:60}
external.api.rate-limit.window-seconds=${EXTERNAL_API_RATE_LIMIT_WINDOW_SECONDS:60}