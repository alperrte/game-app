version: "3.9"

services:
  # -------------------------------
  # 🐳 MSSQL DATABASE SERVER
  # -------------------------------

  mssql:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${MSSQL_CONTAINER}
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U ${DB_USER} -P ${DB_PASSWORD} -C -Q 'SELECT 1'"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # -------------------------------
  # 🗃️ DATABASE INITIALIZER
  # -------------------------------

  # Buraya her servis için database eklemeyi unutmayın.
  database-init:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ltz-database-init
    depends_on:
      mssql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "/opt/mssql-tools18/bin/sqlcmd
      -S ${DB_HOST}
      -U ${DB_USER}
      -P \"$DB_PASSWORD\"
      -C
      -Q \"
      IF DB_ID('$AUTH_DB_NAME') IS NULL CREATE DATABASE [$AUTH_DB_NAME];
      IF DB_ID('$GAME_DB_NAME') IS NULL CREATE DATABASE [$GAME_DB_NAME]; 
      IF DB_ID('$USER_DB_NAME') IS NULL CREATE DATABASE [$USER_DB_NAME];
      IF DB_ID('$SOCIAL_DB_NAME') IS NULL CREATE DATABASE [$SOCIAL_DB_NAME];
      IF DB_ID('$CONTENT_DB_NAME') IS NULL CREATE DATABASE [$CONTENT_DB_NAME];
      IF DB_ID('$REVIEW_DB_NAME') IS NULL CREATE DATABASE [$REVIEW_DB_NAME];
      \""
    env_file:
      - .env
    restart: "no"

  # -------------------------------
  # 🔐 AUTH SERVICE
  # -------------------------------

  auth-service:
    build: ./backend/auth-service
    container_name: ltz-auth-service
    env_file:
      - .env
    depends_on:
      mssql:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: ${SERVER_PORT_AUTH}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${AUTH_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION}

      # OAuth / sosyal giriş + yönlendirme adresleri
      FRONTEND_URL: ${FRONTEND_URL}
      PUBLIC_API_GATEWAY_URL: ${PUBLIC_API_GATEWAY_URL}
      STEAM_API_KEY: ${STEAM_API_KEY}

      # Varsayılan (seed) kullanıcılar — yalnızca geliştirme
      DEFAULT_USERS_ENABLED: ${DEFAULT_USERS_ENABLED}
      DEFAULT_USERS_PASSWORD: ${DEFAULT_USERS_PASSWORD}
      DEFAULT_USER_EMAIL: ${DEFAULT_USER_EMAIL}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_MODERATOR_EMAIL: ${DEFAULT_MODERATOR_EMAIL}
      DEFAULT_DEVELOPER_EMAIL: ${DEFAULT_DEVELOPER_EMAIL}
      DEFAULT_CONTENTCREATOR_EMAIL: ${DEFAULT_CONTENTCREATOR_EMAIL}
    ports:
      - "${SERVER_PORT_AUTH}:${SERVER_PORT_AUTH}"
    restart: unless-stopped

  # -------------------------------
  # 🎮 GAME SERVICE
  # -------------------------------

  game-service:
    build: ./backend/game-service
    container_name: game-app-game-service
    env_file:
      - .env
    depends_on:
      mssql:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: ${SERVER_PORT_GAME}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${GAME_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      STEAM_API_KEY: ${STEAM_API_KEY}
    ports:
      - "${SERVER_PORT_GAME}:${SERVER_PORT_GAME}"
    restart: unless-stopped

  # -------------------------------
  # 👤 USER SERVICE
  # -------------------------------

  user-service:
    build: ./backend/user-service
    container_name: ltz-user-service
    env_file:
      - .env
    depends_on:
      mssql:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: ${SERVER_PORT_USER}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${USER_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - "${SERVER_PORT_USER}:${SERVER_PORT_USER}"
    volumes:
      - ./backend/user-service/uploads:/app/uploads
    restart: unless-stopped

  # -------------------------------
  # 👥 SOCIAL SERVICE
  # -------------------------------

  social-service:
    build: ./backend/social-service
    container_name: ltz-social-service
    env_file:
      - .env
    depends_on:
      mssql:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: ${SERVER_PORT_SOCIAL}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${SOCIAL_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      SOCIAL_MEDIA_UPLOAD_DIR: /app/uploads/social-images
      SOCIAL_MEDIA_VIDEO_UPLOAD_DIR: /app/uploads/social-videos
    ports:
      - "${SERVER_PORT_SOCIAL}:${SERVER_PORT_SOCIAL}"
    volumes:
      - ./backend/social-service/uploads:/app/uploads
    restart: unless-stopped

  # -------------------------------
  # ⭐ REVIEW SERVICE
  # -------------------------------
  review-service:
    build: ./backend/review-service
    container_name: ltz-review-service
    env_file:
      - .env
    depends_on:
      mssql:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    environment:
      SPRING_APPLICATION_NAME: review-service
      SERVER_PORT: ${SERVER_PORT_REVIEW}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${REVIEW_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - "${SERVER_PORT_REVIEW}:${SERVER_PORT_REVIEW}"
    restart: unless-stopped

  # -------------------------------
  # 👥 CONTENT SERVICE
  # -------------------------------
  content-service:
    build: ./backend/content-service
    container_name: ltz-content-service
    env_file: 
      - .env
    depends_on:
      mssql:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: ${SERVER_PORT_CONTENT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${CONTENT_DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - "${SERVER_PORT_CONTENT}:${SERVER_PORT_CONTENT}"
    # Eğer dosya yükleme yapmayacaksanız volumes kısmını silebilirsiniz veya kendi klasörünü verebilirsiniz:
    volumes:
      - ./backend/content-service/uploads:/app/uploads
    restart: unless-stopped

  # -------------------------------
  # 🚪 API GATEWAY
  # -------------------------------

  api-gateway:
    build: ./backend/api-gateway
    container_name: ltz-api-gateway
    env_file:
      - .env
    depends_on:
      auth-service:
        condition: service_started
      game-service:
        condition: service_started
      user-service:
        condition: service_started
      social-service:
        condition: service_started
      review-service:
        condition: service_started
      content-service:
        condition: service_started
    environment:
      SERVER_PORT: ${SERVER_PORT_GATEWAY}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}

      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      SOCIAL_SERVICE_URL: ${SOCIAL_SERVICE_URL}
      REVIEW_SERVICE_URL: ${REVIEW_SERVICE_URL}
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "${SERVER_PORT_GATEWAY}:${SERVER_PORT_GATEWAY}"
    restart: unless-stopped

# -------------------------------
# 💾 VOLUMES
# -------------------------------

volumes:
  mssql_data: